# Ngưỡng theo plan §P1. Sửa ở đây rồi chạy lại: python -m forecast_v2.cli quality
clean:
  last_day_min_share: 0.5   # ngày cuối có dữ liệu: số CSYT báo cáo >= 50% mức thường của cùng thứ
  open_weekday_share: 0.5   # CSYT "thường mở" vào một thứ nếu >= 50% ngày thứ đó có tong > 0
  rampup_days: 28           # mask các ngày đầu CSYT lên hệ thống
  tet_window: [-7, 10]      # ngày quanh mùng 1 Tết: không tính là ngày làm việc, không xét ngoại lai
  outlier_z: 7              # chỉ mask ngày lệch cực lớn; z = 3.5 bắt cả đợt tăng thật (~3% số ngày)
  etl_break_drop: 0.5       # tháng gãy ETL: tỉ lệ chỉ tiêu/tong giảm > 50% so với median 12 tháng trước

quality:                    # đánh giá trên window_days ngày cuối, tính tới ngày cuối có dữ liệu
  window_days: 365
  min_workday_coverage: 0.95
  max_workday_gap: 5        # chuỗi ngày làm việc liên tiếp tong = 0 dài nhất
  min_month_median: 300
  min_year_total: 3600
  min_month_ratio: 0.30     # không tháng nào (trừ tháng Tết, tháng không trọn) < 30% median tháng
  # Nới 18/11/2026 (từ 1% và [0.5, 1.5]): tập chặt 83 -> 141 CSYT. Bảng so sánh các mức: plan §P1.
  max_outlier_ratio: 0.02
  level_shift_up: 2.0       # median 3 tháng sau / 3 tháng trước nằm ngoài [0.4, 2.0] là level shift
  level_shift_down: 0.4
  max_days_since_last: 14
  min_history_days: 365
  lat: [8, 24]
  lon: [102, 110]
  # Tọa độ sai tỉnh: không CSYT nào cùng tỉnh trong 30 CSYT gần nhất. 10 loại oan CSYT sát ranh giới (vd. 34312
  # BV Phụ Dực: 10 CSYT Hải Phòng trong 7 km). Giới hạn: đảo xa (77009 Côn Đảo, ~100 km tới đất liền) vẫn bị loại.
  coord_neighbors: 30
  relaxed:                  # tầng nới, giữ sẵn để mở rộng (~430 CSYT)
    min_workday_coverage: 0.90

facilities:
  large_tuyen: ['1', '2']   # tuyến dùng bán kính lớn
  radius_km: {large: 12, small: 6}

weather:
  start: '2020-12'          # đủ 28 ngày trước 01/2021 cho tổng mưa 28 ngày
  end: '2026-07'            # tới hết horizon 30 ngày sau ngày cuối có dữ liệu (07/06/2026)
  clim_years: [2011, 2025]  # khí hậu nền (ERA5-Land monthly means)
  margin_deg: 0.3
  radii_km: [6, 12]         # phải chứa facilities.radius_km; ablation R thêm {5,7} và {10,15} (chạy lại weather, không tải lại)
  parallel: 3               # số request CDS chạy song song
  thresholds: {cold: 15, severe_cold: 13, hot: 35, very_hot: 37, heavy_rain: 50}  # °C, mm

features:
  horizon: 30
  weather_obs_delay_days: 5 # độ trễ thực tế của ERA5-Land (plan §P3); ablation D thử 1

backtest:                   # gốc = ngày cuối dùng để train; dự báo gốc+1..gốc+horizon (plan §P7)
  val: ['2025-01-15', '2025-09-30', '2025-11-30']                            # tuning; 15/01/2025 bao trọn Tết 2025
  test: ['2026-01-01', '2026-01-31', '2026-03-02', '2026-04-01', '2026-05-01']  # 31/01/2026 bao trọn Tết 2026
  smoke: {csyt: 20, fields: [tong, luot_kham], cutoffs: ['2026-01-31']}      # --smoke: đo thời gian trước khi chạy đủ

models:
  lgbm:                     # plan §P6; tham số tune ở P8 trên các gốc validation
    origin_step: 2          # gốc train cách nhau 2 ngày (7 lẻ nên tự xoay vòng các thứ)
    objective: tweedie      # tweedie | quantile (0,5): chọn trên validation
    rounds: 600
    interval_rounds: 200    # q10/q90: model phân vị riêng
    params: {learning_rate: 0.05, num_leaves: 63, min_data_in_leaf: 200, feature_fraction: 0.8,
             bagging_fraction: 0.7, bagging_freq: 1, lambda_l2: 1.0, max_bin: 127, seed: 0}
  tide:                     # plan §P6; neuralforecast, CPU. Early stopping giữ lại horizon ngày cuối trước gốc làm validation
    input_size: 56
    hidden_size: 512          # mặc định của TiDE; ghi ra để --set đổi được (--set chỉ nhận khóa có sẵn)
    max_steps: 1000
    val_check_steps: 50
    early_stop_patience_steps: 5
    batch_size: 64            # số chuỗi mỗi batch
    windows_batch_size: 512
    learning_rate: 0.001
    random_seed: 0

report:                     # A7: run trong runs/ dùng cho báo cáo tổng (lệnh report); sửa khi chạy lại backtest
  main: 20261123-161154_snaive7-mean4-lgbm-prophet_prod-prophet_clean          # mọi model trừ TiDE, val + test
  tide: [20261121-142639_tide_a3-s2000, 20261122-084951_tide_a3-s2000-test]    # TiDE s2000 (A3): val, test
  ablation:                 # A2: nhãn -> run lgbm bỏ nhóm feature (A3 đầy đủ = main); chạy trước bản sửa q50 (146f590)
    bỏ w_* (giữ clim_*): 20261121-031329_lgbm_drop-weather
    A1 lịch + lễ Tết: 20261121-034354_lgbm_drop-weather-clim
    A0 chỉ lịch: 20261121-041355_lgbm_drop-holiday-weather-clim
    A2 lịch + khí tượng: 20261121-044753_lgbm_drop-holiday
  tet_cutoff: '2026-01-31'  # biểu đồ Tết 2026 theo tuyến

fields:
  direct: [tong, luot_kham, ngoai_tru, noi_tru, cap_cuu]
  min_month_median: 30      # bỏ cặp CSYT × chỉ tiêu có median tháng < 30
